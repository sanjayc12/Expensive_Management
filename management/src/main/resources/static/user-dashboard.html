<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Expense Management
    </div>

    <div>
        <span id="userEmail"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

</nav>

<div class="dashboard">

    <h1>User Dashboard</h1>

    <div class="card">

        <h2>Submit Expense</h2>

        <form id="expenseForm">

            <label>Amount</label>

            <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="1"
                    step="0.01"
                    required
            >

            <label>Description</label>

            <textarea
                    id="description"
                    placeholder="Enter expense description"
                    required
            ></textarea>

            <button type="submit">
                Submit Expense
            </button>

        </form>

        <p id="expenseMessage" class="message"></p>

    </div>


    <div class="card">

        <div class="section-header">

            <h2>My Expenses</h2>

            <button
                    class="refresh-btn"
                    onclick="loadMyExpenses()">
                Refresh
            </button>

        </div>

        <div class="table-container">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Amount</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Manager Comment</th>
                    <th>Created</th>
                </tr>
                </thead>

                <tbody id="expenseTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
